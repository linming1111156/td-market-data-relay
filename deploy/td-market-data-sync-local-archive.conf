[Unit]
RequiresMountsFor=/mnt/data/td-market-data-local

[Service]
StateDirectory=
ExecStart=
ExecStart=/opt/td-market-data-relay/.venv/bin/python3 /opt/td-market-data-relay/sync.py --output /mnt/data/td-market-data-local/state --archive-root /mnt/data/td-market-data-local/archive --direct-archive --continuous --poll-seconds 300 --state-file /mnt/data/td-market-data-local/state/vps-sync-cursor.json
ReadWritePaths=
ReadWritePaths=/mnt/data/td-market-data-local
